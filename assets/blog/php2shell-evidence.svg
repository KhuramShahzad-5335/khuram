<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><rect width="1000" height="460" rx="18" fill="#0e131b"/><text x="45" y="58" fill="#c3b1ff" font-family="monospace" font-size="16" letter-spacing="2">READ THE EVIDENCE, NOT JUST THE HEADLINE</text><g font-family="Arial,sans-serif"><rect x="45" y="105" width="280" height="225" rx="14" fill="#191f2b" stroke="#95a9d4"/><text x="68" y="152" fill="#95a9d4" font-size="18">01 / ATTEMPT</text><text x="68" y="200" fill="#f2f5fb" font-size="23">A request was sent.</text><text x="68" y="244" fill="#aab6ca" font-size="17">It may fail or be blocked.</text><text x="68" y="274" fill="#aab6ca" font-size="17">Not proof of a breach.</text><rect x="360" y="105" width="280" height="225" rx="14" fill="#251d17" stroke="#ffb57d"/><text x="383" y="152" fill="#ffb57d" font-size="18">02 / EXECUTION</text><text x="383" y="200" fill="#f2f5fb" font-size="23">Code actually ran.</text><text x="383" y="244" fill="#aab6ca" font-size="17">Identify the target:</text><text x="383" y="274" fill="#aab6ca" font-size="17">research or production?</text><rect x="675" y="105" width="280" height="225" rx="14" fill="#281b26" stroke="#eea8d5"/><text x="698" y="152" fill="#eea8d5" font-size="18">03 / BREACH</text><text x="698" y="200" fill="#f2f5fb" font-size="23">Production impact.</text><text x="698" y="244" fill="#aab6ca" font-size="17">Require evidence of scope,</text><text x="698" y="274" fill="#aab6ca" font-size="17">not an inferred victim list.</text></g><text x="45" y="394" fill="#97a6bc" font-family="monospace" font-size="14">Separate claims. Separate evidence. Date every assessment.</text></svg>